name: Offline browser tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, work]

jobs:
  offline-browser:
    name: Playwright offline shell (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [mobile-chromium, mobile-webkit]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build production app and generated offline assets
        run: npm run build

      - name: Run unit/offline tests
        run: npm test

      - name: Run offline browser tests
        run: npm run test:offline-browser -- --project=${{ matrix.project }}
