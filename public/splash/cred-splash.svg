<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 2796" role="img" aria-labelledby="title desc">
  <title id="title">CRED launch screen</title>
  <desc id="desc">CRED branded launch screen for installed PWA startup.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f8fc"/>
      <stop offset="1" stop-color="#edf2ff"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#155dfc"/>
      <stop offset="1" stop-color="#14213d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#14213d" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1290" height="2796" fill="url(#page)"/>
  <g filter="url(#shadow)">
    <rect x="267" y="1068" width="756" height="660" rx="56" fill="#ffffff"/>
    <rect x="531" y="1172" width="228" height="228" rx="50" fill="url(#icon)"/>
    <circle cx="645" cy="1280" r="70" fill="#ffffff"/>
    <circle cx="645" cy="1280" r="54" fill="#155dfc"/>
    <text x="645" y="1295" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800" fill="#ffffff">CRED</text>
    <text x="645" y="1512" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="800" letter-spacing="4" fill="#155dfc">CRED</text>
    <text x="645" y="1580" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" letter-spacing="7" fill="#14213d">CAPTURE REVIEW EXTRACT DOCUMENT</text>
  </g>
</svg>
