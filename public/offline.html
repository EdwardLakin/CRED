<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>CRED Offline</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f172a;color:#e5eefb}body{margin:0;background:linear-gradient(135deg,#0f172a,#111827);min-height:100vh}.shell{max-width:920px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom))}.card{background:rgba(15,23,42,.88);border:1px solid rgba(148,163,184,.24);border-radius:24px;box-shadow:0 22px 70px rgba(0,0,0,.35);padding:20px;margin:16px 0}.eyebrow{color:#93c5fd;text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:800}h1{font-size:clamp(30px,8vw,54px);line-height:.95;margin:.25em 0}h2{margin:.2em 0}.muted{color:#a6b6ce}.button-row{display:flex;flex-wrap:wrap;gap:12px}.button,button{appearance:none;border:0;border-radius:999px;padding:13px 18px;font-weight:800;background:#2563eb;color:white;min-height:48px}.secondary{background:#334155}.danger{background:#991b1b}.ghost{background:transparent;border:1px solid #64748b}.status{display:inline-flex;border-radius:999px;background:#172554;color:#bfdbfe;padding:6px 10px;font-size:12px;font-weight:800}.error{color:#fecaca}.success{color:#bbf7d0}.warning{color:#fde68a}.grid{display:grid;gap:14px}.capture img,.capture video{max-width:100%;max-height:420px;border-radius:16px;background:#020617;display:block}textarea,input{width:100%;box-sizing:border-box;border-radius:14px;border:1px solid #475569;background:#020617;color:#e5eefb;padding:12px;font:inherit}.tiny{font-size:12px}.hidden{display:none!important}</style>
</head>
<body><main class="shell"><section class="card"><p class="eyebrow">CRED offline shell</p><h1>Offline Dashboard</h1><p class="muted" id="provisioning">Checking this device…</p><p class="tiny muted" id="version">Service worker: checking…</p><p id="message"></p><div class="button-row"><button id="newSession">New Offline Session</button><button id="continueSession" class="secondary">Continue Offline Session</button><button id="syncNow" class="ghost">Sync now</button></div></section><section id="workspace" class="hidden"></section></main><script>
(()=>{const DB='cred-offline',VER=2,SCHEMA=2,MAX_PHOTO=25*1024*1024,MAX_VIDEO=50*1024*1024;let active=null,urls=[];const $=id=>document.getElementById(id), msg=(t,c='')=>{const e=$('message');e.textContent=t||'';e.className=c};
function openDb(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,VER);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('queuedCaptures')){const s=db.createObjectStore('queuedCaptures',{keyPath:'localId'});s.createIndex('by-session','sessionId');s.createIndex('by-user','userId');s.createIndex('by-status','status');s.createIndex('by-created-at','createdAt')}if(!db.objectStoreNames.contains('cachedSessions')){const s=db.createObjectStore('cachedSessions',{keyPath:'sessionId'});s.createIndex('by-user','userId');s.createIndex('by-organization','organizationId');s.createIndex('by-cached-at','cachedAt')}if(!db.objectStoreNames.contains('offlineSessions')){const s=db.createObjectStore('offlineSessions',{keyPath:'localSessionId'});s.createIndex('by-user','userId');s.createIndex('by-organization','organizationId');s.createIndex('by-status','status');s.createIndex('by-created-at','createdAt')}if(!db.objectStoreNames.contains('syncState'))db.createObjectStore('syncState',{keyPath:'id'});if(!db.objectStoreNames.contains('settings'))db.createObjectStore('settings',{keyPath:'key'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function store(name,mode='readonly'){const db=await openDb();return db.transaction(name,mode).objectStore(name)}
async function getAll(name){return new Promise(async(res,rej)=>{const r=(await store(name)).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function put(name,val){return new Promise(async(res,rej)=>{const r=(await store(name,'readwrite')).put(val);r.onsuccess=()=>res(val);r.onerror=()=>rej(r.error)})}async function del(name,key){return new Promise(async(res,rej)=>{const r=(await store(name,'readwrite')).delete(key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function identity(){const userId=localStorage.getItem('cred-offline-user-id'),organizationId=localStorage.getItem('cred-offline-organization-id'),provisionedAt=localStorage.getItem('cred-offline-provisioned-at');return userId&&organizationId?{userId,organizationId,provisionedAt,schemaVersion:SCHEMA}:null}function id(){return (crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2))}function iso(){return new Date().toISOString()}function fmt(b){return b<1048576?Math.max(1,Math.round(b/1024))+' KB':(b/1048576).toFixed(1)+' MB'}
async function pending(){const i=identity();return (await getAll('queuedCaptures')).filter(r=>!i||r.userId===i.userId).filter(r=>r.status!=='synced')}async function sessions(){const i=identity();return (await getAll('offlineSessions')).filter(s=>i&&s.userId===i.userId&&s.organizationId===i.organizationId).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt))}
async function createSession(){const i=identity();if(!i)return msg('This device has not been provisioned. Sign in online once, then open the dashboard to provision offline access.','error');const ts=iso();const rec={localSessionId:'offline-'+id(),organizationId:i.organizationId,userId:i.userId,title:'Offline Evidence '+new Date().toLocaleString(),sessionType:'General Evidence Report',status:'local',serverSessionId:null,retryCount:0,lastError:null,createdAt:ts,updatedAt:ts};await put('offlineSessions',rec);await openSession(rec.localSessionId)}
async function openSession(localSessionId){const s=(await sessions()).find(x=>x.localSessionId===localSessionId);if(!s)return msg('No unfinished offline session is saved on this device.','error');active=s;await renderWorkspace()}
async function renderWorkspace(){urls.forEach(URL.revokeObjectURL);urls=[];const rows=(await pending()).filter(r=>r.sessionId===(active.serverSessionId||active.localSessionId)||r.sessionId===active.localSessionId).sort((a,b)=>(a.metadata.reportOrder??999999)-(b.metadata.reportOrder??999999)||a.createdAt.localeCompare(b.createdAt));$('workspace').classList.remove('hidden');$('workspace').innerHTML=`<section class="card"><p class="eyebrow">Offline capture</p><h2>${active.title}</h2><p class="muted">${rows.length} local capture${rows.length===1?'':'s'} saved. Photos/videos and notes are stored in IndexedDB and restored after relaunch.</p><div class="button-row"><button id="camera">Camera</button><button id="gallery" class="secondary">Gallery</button><button id="closeWs" class="ghost">Back</button></div><input id="cameraInput" class="hidden" type="file" accept="image/*,video/*" capture="environment" multiple><input id="galleryInput" class="hidden" type="file" accept="image/*,video/*" multiple></section><section class="grid" id="captures"></section>`;$('camera').onclick=()=>$('cameraInput').click();$('gallery').onclick=()=>$('galleryInput').click();$('closeWs').onclick=()=>{$('workspace').classList.add('hidden');active=null};$('cameraInput').onchange=$('galleryInput').onchange=e=>addFiles([...e.target.files]);const list=$('captures');for(const [n,r]of rows.entries()){const u=URL.createObjectURL(r.blob);urls.push(u);const article=document.createElement('article');article.className='card capture';article.innerHTML=`<div class="button-row"><span class="status">${r.status}</span><button class="secondary" data-up>↑</button><button class="secondary" data-down>↓</button><button class="danger" data-del>Delete</button></div><p class="muted">${n+1}. ${r.metadata.filename} · ${fmt(r.metadata.size)}</p>${r.metadata.mimeType.startsWith('video/')?`<video controls src="${u}"></video>`:`<img alt="Capture ${n+1}" src="${u}">`}<label class="muted">Technician notes<textarea rows="4">${(r.metadata.technicianNote||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}</textarea></label>`;article.querySelector('textarea').oninput=async e=>{r.metadata.technicianNote=e.target.value;r.metadata.noteSource='edited';r.metadata.noteSaveStatus='saved';r.updatedAt=iso();await put('queuedCaptures',r)};article.querySelector('[data-del]').onclick=async()=>{await del('queuedCaptures',r.localId);renderWorkspace()};article.querySelector('[data-up]').onclick=()=>move(r.localId,-1,rows);article.querySelector('[data-down]').onclick=()=>move(r.localId,1,rows);list.append(article)}}
async function addFiles(files){if(!active)return;for(const file of files){const max=file.type.startsWith('video/')?MAX_VIDEO:MAX_PHOTO;if(file.size>max){msg(file.name+' is larger than the offline limit.','error');continue}const localId=id(), order=(await pending()).filter(r=>r.sessionId===(active.serverSessionId||active.localSessionId)||r.sessionId===active.localSessionId).length;await put('queuedCaptures',{localId,clientMutationId:localId,organizationId:active.organizationId,workspaceId:null,sessionId:active.serverSessionId||active.localSessionId,userId:active.userId,blob:file,metadata:{captureIntent:'auto_evidence',manualType:null,guidedStep:null,guidedLabel:null,workflow:null,technicianNote:'',transcriptStatus:'not_started',noteSource:'manual',reportOrder:order,includeInReport:true,filename:file.name,mimeType:file.type||'application/octet-stream',size:file.size,uploadStatus:'queued',noteSaveStatus:'idle'},status:'local',retryCount:0,lastError:null,uploadState:{storagePath:null,uploadedAt:null,finalizedAt:null},serverCaptureId:null,createdAt:iso(),updatedAt:iso()})}msg(files.length+' capture(s) saved on this device.','success');renderWorkspace();refresh()}
async function move(localId,dir,rows){const i=rows.findIndex(r=>r.localId===localId),j=i+dir;if(i<0||j<0||j>=rows.length)return;[rows[i],rows[j]]=[rows[j],rows[i]];for(let n=0;n<rows.length;n++){rows[n].metadata.reportOrder=n;rows[n].updatedAt=iso();await put('queuedCaptures',rows[n])}renderWorkspace()}
async function sync(){if(!navigator.onLine)return msg('Still offline. CRED will sync after you reconnect and open the app online.','warning');const i=identity();if(!i)return;msg('Creating/recovering server session…','warning');for(const s of await sessions()){if(s.serverSessionId)continue;s.status='creating';s.updatedAt=iso();await put('offlineSessions',s);const r=await fetch('/api/dashboard/sessions/offline',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clientSessionId:s.localSessionId,title:s.title,sessionType:s.sessionType,createdAt:s.createdAt})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.sessionId){s.status='failed';s.lastError=j.error||'Unable to create server session';s.retryCount++;await put('offlineSessions',s);throw new Error(s.lastError)}const caps=await pending();for(const c of caps.filter(c=>c.sessionId===s.localSessionId&&c.userId===i.userId)){c.sessionId=j.sessionId;c.updatedAt=iso();await put('queuedCaptures',c)}s.serverSessionId=j.sessionId;s.status='ready';s.lastError=null;await put('offlineSessions',s)}msg('Server session recovered. Open CRED online to upload queued media and verify final sync.','success')}
async function refresh(){const i=identity();$('provisioning').textContent=i?`Provisioned for this device at ${i.provisionedAt||'unknown time'}. Pending uploads: ${(await pending()).length}.`:'Never-provisioned device: sign in online once and open Dashboard to provision offline access.';if(navigator.serviceWorker?.controller){const ch=new MessageChannel();ch.port1.onmessage=e=>$('version').textContent='Service worker: '+JSON.stringify(e.data);navigator.serviceWorker.controller.postMessage({type:'CRED_SW_DIAGNOSTICS'},[ch.port2])}}$('newSession').onclick=createSession;$('continueSession').onclick=async()=>{const s=(await sessions()).find(s=>s.status!=='ready'||!s.serverSessionId);s?openSession(s.localSessionId):msg('No unfinished offline session is saved on this device.','error')};$('syncNow').onclick=()=>sync().catch(e=>msg(e.message,'error'));window.addEventListener('online',()=>sync().catch(()=>{}));refresh();navigator.storage?.persist?.().catch(()=>{});})();
</script></body></html>
